services:
  - type: web
    name: voicescript
    runtime: python
    pythonVersion: "3.11.0"
    nativePackages:
      - ffmpeg
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --threads 2 --timeout 900 --keep-alive 30 --max-requests 50"
    plan: free
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
